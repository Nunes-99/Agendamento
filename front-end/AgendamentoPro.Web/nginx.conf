# =============================================================================
# nginx.conf — AgendamentoPro frontend (Angular SPA)
#
# Em desenvolvimento / atrás de proxy/CDN com TLS termination, basta o bloco HTTP.
# Para servir HTTPS direto a partir do container, descomente o bloco "HTTPS"
# e monte os certificados em /etc/nginx/ssl/.
# =============================================================================

# -----------------------------------------------------------------------------
# Security headers reutilizáveis
# -----------------------------------------------------------------------------
map $sent_http_content_type $csp_value {
    default "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https: blob:; connect-src 'self' https: wss:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'";
}

# -----------------------------------------------------------------------------
# HTTP (porta 80)
# Em produção atrás de TLS-termination (Cloudflare, Traefik, ALB) este bloco é
# o único necessário. Se for redirecionar HTTP→HTTPS no próprio nginx, troque
# pelo `return 301 https://$host$request_uri;` no bloco "/" e ative o HTTPS abaixo.
# -----------------------------------------------------------------------------
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 15m; # alinhado com upload de fotos do backend

    # Security headers (aplicados a TODAS as respostas)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), payment=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy $csp_value always;

    # Cache agressivo para assets versionados (hash no nome)
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # SPA fallback — sem cache no index.html
    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        try_files $uri $uri/ /index.html;
    }

    # Compressão
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css text/plain application/javascript application/json image/svg+xml application/xml application/xml+rss font/woff2;
    gzip_vary on;
}

