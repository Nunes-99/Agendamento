name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  backend:
    name: Backend (.NET 8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        working-directory: ./back-end
        run: dotnet restore AgendamentoPro.sln
      - name: Build
        working-directory: ./back-end
        run: dotnet build AgendamentoPro.sln --no-restore --configuration Release
      - name: Test
        working-directory: ./back-end
        run: dotnet test AgendamentoPro.Tests/AgendamentoPro.Tests.csproj --no-build --configuration Release --logger "trx;LogFileName=tests.trx" --collect:"XPlat Code Coverage"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: back-end/AgendamentoPro.Tests/TestResults/

  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: front-end/AgendamentoPro.Web/package-lock.json
      - name: Install
        working-directory: ./front-end/AgendamentoPro.Web
        run: npm ci
      - name: Build (production)
        working-directory: ./front-end/AgendamentoPro.Web
        run: npx ng build --configuration=production

  docker:
    name: Docker build smoke test
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f back-end/Dockerfile back-end -t agendamentopro-api:ci
      - name: Build Web image
        run: docker build -f front-end/AgendamentoPro.Web/Dockerfile front-end/AgendamentoPro.Web -t agendamentopro-web:ci
