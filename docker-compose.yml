version: '3.9'
services:
  api:
    build:
      context: ./back-end
      dockerfile: Dockerfile
    ports:
      - "5050:8080"
    env_file:
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Production}
      - Database__Provider=${Database__Provider:-Sqlite}
      - ConnectionStrings__Default=${ConnectionStrings__Default:-Data Source=/data/agendamento.db}
      - UPLOADS_PATH=${UPLOADS_PATH:-/data/uploads}
    volumes:
      - api-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/api/health/ready || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  web:
    build:
      context: ./front-end/AgendamentoPro.Web
      dockerfile: Dockerfile
    ports:
      - "4200:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

volumes:
  api-data:
